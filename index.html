<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0c0f14;--panel:#141922;--panel2:#1a2130;--line:#252e3e;--text:#e6ebf2;--muted:#8693a8;--dim:#5c6880;
  --green:#2fbf71;--green-bg:rgba(47,191,113,.12);--red:#f0565b;--red-bg:rgba(240,86,91,.12);
  --accent:#f2b84b;--accent-bg:rgba(242,184,75,.12);--blue:#5aa2ff;
  --mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;--r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}.mut{color:var(--muted)}
header{position:sticky;top:0;z-index:20;background:rgba(12,15,20,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;padding:12px 22px;flex-wrap:wrap}
.brand{font-family:var(--mono);font-weight:600;letter-spacing:.14em;font-size:13px;display:flex;align-items:center;gap:8px}
.brand i{width:8px;height:8px;background:var(--accent);display:inline-block;border-radius:2px}
nav{display:flex;gap:2px}
nav a{padding:7px 12px;border-radius:7px;color:var(--muted);text-decoration:none;font-weight:500}
nav a:hover{color:var(--text);background:var(--panel)}
nav a.on{color:var(--text);background:var(--panel2)}
.sp{flex:1}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status b{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.status.ok b{background:var(--green)}.status.warn b{background:var(--accent)}.status.err b{background:var(--red)}
.btn{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#36425a}
.btn.pri{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red);border-color:rgba(240,86,91,.4);background:transparent}
.btn.sm{padding:5px 10px;font-size:12px}
.filters{display:flex;gap:10px;padding:0 22px 12px;flex-wrap:wrap;align-items:center}
.filters label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-right:-4px}
select,input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;width:100%}
main{padding:22px;max-width:1400px;margin:0 auto}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:6px}
.kpi .s{font-size:12px;color:var(--dim);margin-top:3px;font-family:var(--mono)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 12px;font-weight:600}
.sec{margin-top:22px}
.two{grid-template-columns:2fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
@media(max-width:980px){.two,.three{grid-template-columns:1fr}}
.chartbox{position:relative;height:260px}
.acct{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.acct .card{padding:16px 18px}
.acct .top{display:flex;justify-content:space-between;align-items:baseline}
.acct .name{font-weight:600}
.acct .bal{font-family:var(--mono);font-size:24px;font-weight:600;margin:8px 0 12px}
.meter{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:5px 0 3px}
.meter i{display:block;height:100%;border-radius:4px}
.mrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:9px}
.mrow b{font-family:var(--mono);font-weight:500;color:var(--text)}
.bars .row{display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:10px;padding:5px 0;font-size:13px}
.bars .row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{height:16px;position:relative;background:var(--panel2);border-radius:3px}
.bars .track i{position:absolute;top:0;bottom:0;border-radius:3px}
.bars .track .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.bars .val{text-align:right;font-family:var(--mono);font-size:12px}
.bars .sub{font-size:11px;color:var(--dim);font-family:var(--mono)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
td{padding:9px 10px;border-bottom:1px solid #1c2330;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--panel2)}
td.r,th.r{text-align:right}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;background:var(--panel2);font-size:11px;color:var(--muted);border:1px solid var(--line)}
.tag.long{color:var(--green);border-color:rgba(47,191,113,.35);background:var(--green-bg)}
.tag.short{color:var(--red);border-color:rgba(240,86,91,.35);background:var(--red-bg)}
.tag.warn{color:var(--accent);border-color:rgba(242,184,75,.35);background:var(--accent-bg)}
.tablewrap{overflow-x:auto}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h3{color:var(--text);margin:0 0 8px;font-size:18px}
/* calendar */
.calhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.calhead .t{font-size:18px;font-weight:600;min-width:180px}
.cal{display:grid;grid-template-columns:repeat(7,1fr) 120px;gap:6px}
.cal .dow{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;padding:4px 6px}
.cal .d{min-height:92px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;display:flex;flex-direction:column}
.cal .d:hover{border-color:#3a4760}
.cal .d.out{opacity:.3}
.cal .d.today{outline:1px solid var(--accent)}
.cal .d .n{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.cal .d .p{font-family:var(--mono);font-weight:600;font-size:15px;margin-top:auto}
.cal .d .c{font-size:11px;color:var(--dim)}
.cal .d.win{background:linear-gradient(180deg,rgba(47,191,113,.16),rgba(47,191,113,.05));border-color:rgba(47,191,113,.35)}
.cal .d.loss{background:linear-gradient(180deg,rgba(240,86,91,.16),rgba(240,86,91,.05));border-color:rgba(240,86,91,.35)}
.cal .wk{background:var(--panel2);border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:center;font-size:11px;color:var(--dim)}
.cal .wk b{font-family:var(--mono);font-size:14px}
.note-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);display:inline-block}
@media(max-width:760px){.cal{grid-template-columns:repeat(7,1fr)}.cal .wk,.cal .wkh{display:none}.cal .d{min-height:64px;padding:5px}.cal .d .p{font-size:11px}}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,7,10,.72);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:820px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal.sm{max-width:420px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:16px}
.mb{padding:18px 20px}
.mf{display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.x{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.form .f{display:flex;flex-direction:column;gap:5px;min-width:0}
.form .f label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.form .f input,.form .f select{width:100%}
.form .w2{grid-column:span 2}.form .w4{grid-column:1/-1}
@media(max-width:640px){.form{grid-template-columns:repeat(2,1fr)}}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;background:var(--panel);border:0;padding:7px;cursor:pointer;color:var(--muted)}
.seg button.on.L{background:var(--green-bg);color:var(--green)}
.seg button.on.S{background:var(--red-bg);color:var(--red)}
.seg button.on.N{background:var(--accent-bg);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12px;color:var(--muted)}
.chip.on{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.chip.on.g{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.preview{display:flex;gap:22px;font-family:var(--mono);font-size:13px;flex-wrap:wrap}
.preview span{color:var(--dim);font-family:var(--sans);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-right:6px}
.hint{font-size:12px;color:var(--dim)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:9px;z-index:80;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.cfg table td{padding:5px 6px}
.cfg table input,.cfg table select{width:100%;padding:5px 7px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.banner{background:var(--accent-bg);border:1px solid rgba(242,184,75,.35);color:var(--accent);padding:10px 14px;border-radius:9px;margin-bottom:16px;font-size:13px}
.rules{white-space:pre-wrap;font-size:13px;color:var(--muted);line-height:1.6}
a.link{color:var(--blue)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><i></i>TRADE JOURNAL</div>
    <nav id="nav">
      <a href="#dashboard" data-v="dashboard">Dashboard</a>
      <a href="#trades" data-v="trades">Trades</a>
      <a href="#calendar" data-v="calendar">Calendar</a>
      <a href="#config" data-v="config">Setup</a>
    </nav>
    <div class="sp"></div>
    <div class="status" id="status"><b></b><span>Connecting…</span></div>
    <div id="who" style="display:flex;gap:8px;align-items:center"></div>
    <button class="btn pri" id="newBtn">+ Log trade</button>
  </div>
  <div class="filters" id="filters"></div>
</header>
<main id="main"></main>
<div id="modalRoot"></div>

<script>
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum=v=>v!==null&&v!==undefined&&v!==''&&isFinite(v);
const num=v=>{if(v===null||v===undefined)return null;let s=String(v).trim().replace(/[\s$€£]/g,'');if(s==='')return null;
  if(/^-?\d+k$/i.test(s))return parseFloat(s)*1000;
  if(s.includes(',')&&s.includes('.'))s=s.replace(/,/g,'');else if(/^-?\d{1,3}(,\d{3})+$/.test(s))s=s.replace(/,/g,'');else s=s.replace(',','.');
  const n=Number(s);return isFinite(n)?n:null};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const usd=(v,sign)=>{if(!isNum(v))return '—';const s=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return (v<0?'-':(sign&&v>0?'+':''))+'$'+s};
const usd0=v=>{if(!isNum(v))return '—';return (v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:0})};
const cls=v=>v>0?'pos':v<0?'neg':'';
const fx=(v,d=2)=>isNum(v)?(+v).toFixed(d):'—';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------- defaults ---------- */
const DEFAULTS={
  accounts:[{id:'a1',name:'Topstep 50K',start:50000,mll:2000,dll:null,target:3000,trail:'eod'}],
  instruments:[{sym:'MES',pv:5,fee:0},{sym:'MNQ',pv:2,fee:0},{sym:'ES',pv:50,fee:0},{sym:'NQ',pv:20,fee:0},{sym:'MYM',pv:0.5,fee:0},{sym:'M2K',pv:5,fee:0},{sym:'MGC',pv:10,fee:0},{sym:'MCL',pv:100,fee:0}],
  setups:['FVG','iFVG','ORB + FVG','Liquidity sweep','Other'],
  mistakes:['FOMO entry','Moved stop','Oversized','Cut winner early','Revenge trade','No valid setup','Overtraded','Traded news'],
  sessions:['Asia','London','NY AM','NY PM'],
  emotions:['Calm','Confident','Hesitant','Anxious','Frustrated','Greedy'],
  rules:'Max 3 trades per day\nStop for the day after 2 losses\nOnly A/B setups at key levels\nNever move the stop further away',
  maxTradesPerDay:3
};
function mergeSettings(s){const o=JSON.parse(JSON.stringify(DEFAULTS));if(!s)return o;for(const k of Object.keys(o)){if(s[k]!==undefined&&s[k]!==null)o[k]=JSON.parse(JSON.stringify(s[k]))}return o}

/* ---------- store (Supabase) ---------- */
const SB_URL='https://elxjgbklaprtmjqvxlso.supabase.co';
const SB_KEY='sb_publishable_FwEDaD2qS2VcSgjf4GaBoA_WhblhY0Z';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const store={mode:'loading',user:null,trades:[],days:{},settings:mergeSettings(null)};
function setStatus(k,txt){const el=$('#status');el.className='status '+k;el.querySelector('span').textContent=txt}
const toRow=t=>({id:t.id,date:t.date,time:t.time||null,account:t.account||null,instrument:t.instrument,side:t.side,contracts:t.contracts,entry:t.entry,exit:t.exit,stop:t.stop,target:t.target,fees:t.fees,pnl_override:t.pnlOverride,setup:t.setup||null,session:t.session||null,grade:t.grade||null,emotion:t.emotion||null,followed_plan:t.followedPlan,mistakes:t.mistakes||[],notes:t.notes||null,link:t.link||null,updated_at:new Date().toISOString()});
const fromRow=r=>({id:r.id,date:r.date,time:r.time||'',account:r.account,instrument:r.instrument,side:r.side,contracts:r.contracts,entry:r.entry,exit:r.exit,stop:r.stop,target:r.target,fees:r.fees,pnlOverride:r.pnl_override,setup:r.setup||'',session:r.session||'',grade:r.grade||'',emotion:r.emotion||'',followedPlan:r.followed_plan,mistakes:r.mistakes||[],notes:r.notes||'',link:r.link||''});
async function loadAll(){
  setStatus('','Loading…');
  const [t,d,st]=await Promise.all([
    sb.from('trades').select('*').order('date').limit(10000),
    sb.from('day_notes').select('*'),
    sb.from('journal_settings').select('data').maybeSingle()]);
  if(t.error||d.error||st.error){setStatus('err','Couldn’t load data');console.error(t.error||d.error||st.error);return}
  store.trades=t.data.map(fromRow);
  const o={};d.data.forEach(r=>o[r.date]={plan:r.plan||'',review:r.review||'',mood:r.mood||'',rules:r.rules||''});store.days=o;
  store.settings=mergeSettings(st.data?st.data.data:null);
  store.mode='db';setStatus('ok','Synced');render();
}
async function guard(p){const {error}=await p;if(error){console.error(error);toast('Save failed: '+error.message);setStatus('err','Last save failed');return false}setStatus('ok','Synced');return true}
async function saveTrade(t){
  if(!await guard(sb.from('trades').upsert(toRow(t))))return false;
  const i=store.trades.findIndex(x=>x.id===t.id);if(i>=0)store.trades[i]=t;else store.trades.push(t);render();return true;
}
async function deleteTrade(id){
  if(!await guard(sb.from('trades').delete().eq('id',id)))return false;
  store.trades=store.trades.filter(x=>x.id!==id);render();return true;
}
async function saveDay(date,obj){
  if(!await guard(sb.from('day_notes').upsert({user_id:store.user.id,date,...obj,updated_at:new Date().toISOString()},{onConflict:'user_id,date'})))return false;
  store.days[date]=obj;render();return true;
}
async function saveSettings(s,silent){
  const data=JSON.parse(JSON.stringify(s));
  if(!await guard(sb.from('journal_settings').upsert({user_id:store.user.id,data,updated_at:new Date().toISOString()},{onConflict:'user_id'})))return false;
  store.settings=mergeSettings(data);if(!silent)render();return true;
}
/* auth */
function showLogin(msg){
  $('#main').innerHTML=`<div class="card" style="max-width:380px;margin:60px auto;padding:26px">
   <h3 style="margin:0 0 4px">Sign in to your journal</h3><p class="hint" style="margin:0 0 18px">Your trades are stored in your own Supabase database.</p>
   <form id="lf" onsubmit="return false" style="display:flex;flex-direction:column;gap:10px">
    <input id="le" type="email" placeholder="Email" autocomplete="email" required>
    <input id="lp" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password" required>
    <button class="btn pri" id="lin">Sign in</button>
    <button class="btn" id="lup" type="button">Create account</button>
    <div class="hint" id="lmsg">${esc(msg||'')}</div></form></div>`;
  $('#filters').style.display='none';
  const go=async up=>{const email=$('#le').value.trim(),password=$('#lp').value;if(!email||password.length<6){$('#lmsg').textContent='Enter your email and a password of at least 6 characters.';return}
    $('#lmsg').textContent=up?'Creating account…':'Signing in…';
    const r=up?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email,password});
    if(r.error){$('#lmsg').textContent=r.error.message;return}
    if(up&&!r.data.session)$('#lmsg').textContent='Check your inbox and click the confirmation link, then sign in here.'};
  $('#lin').onclick=()=>go(false);$('#lup').onclick=()=>go(true);
}
async function initStore(){
  const {data}=await sb.auth.getSession();
  store.user=data.session?data.session.user:null;
  sb.auth.onAuthStateChange((ev,session)=>{const was=store.user&&store.user.id;store.user=session?session.user:null;
    if(store.user&&store.user.id!==was){loadAll()}else if(!store.user&&was){store.trades=[];store.days={};showLogin()} renderUser()});
  renderUser();
  if(store.user)loadAll();else{setStatus('warn','Signed out');showLogin()}
  window.addEventListener('focus',()=>{if(store.user&&!$('#modalRoot').innerHTML&&!(view==='config'&&cfgDirty))loadAll()});
}
function renderUser(){const el=$('#who');if(!el)return;el.innerHTML=store.user?`<span class="mut" style="font-size:12px">${esc(store.user.email)}</span> <button class="btn sm" id="out">Sign out</button>`:'';
  const o=$('#out');if(o)o.onclick=()=>sb.auth.signOut()}

/* ---------- calc ---------- */
function inst(sym){return store.settings.instruments.find(i=>i.sym===sym)}
function pv(sym){const i=inst(sym);return i?+i.pv:1}
function calc(t){
  const p=pv(t.instrument),dir=t.side==='Short'?-1:1,q=+t.contracts||0;
  const hasPx=isNum(t.entry)&&isNum(t.exit);
  const pts=hasPx?(t.exit-t.entry)*dir:null;
  const gross=isNum(t.pnlOverride)?+t.pnlOverride:(hasPx?pts*p*q:0);
  const fees=+t.fees||0,net=gross-fees;
  const risk=isNum(t.stop)&&isNum(t.entry)&&q?Math.abs(t.entry-t.stop)*p*q:null;
  const r=risk?net/risk:null;
  const plannedR=risk&&isNum(t.target)?Math.abs(t.target-t.entry)*p*q/risk:null;
  return {pts,gross,net,risk,r,plannedR};
}
const sortKey=t=>`${t.date||''} ${t.time||'00:00'} ${t.id}`;
function allSorted(){return [...store.trades].sort((a,b)=>sortKey(a)<sortKey(b)?-1:1)}

/* ---------- filters ---------- */
const F={account:'all',range:'all',from:'',to:'',instrument:'all',setup:'all'};
try{Object.assign(F,JSON.parse(localStorage.getItem('tj_filters')||'{}'))}catch(e){}
function rangeBounds(){
  const d=new Date(),t=today();
  if(F.range==='today')return [t,t];
  if(F.range==='week'){const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));return [ymd(m),t]}

  if(F.range==='30d'){const m=new Date(d);m.setDate(d.getDate()-29);return [ymd(m),t]}
  if(F.range==='ytd')return [`${d.getFullYear()}-01-01`,t];
  if(F.range==='custom')return [F.from||'0000',F.to||'9999'];
  return ['0000','9999'];
}
function filtered(opts={}){

  return allSorted().filter(t=>(F.account==='all'||t.account===F.account)&&(F.instrument==='all'||t.instrument===F.instrument)&&(F.setup==='all'||t.setup===F.setup)&&t.date>=a&&t.date<=b);
}

/* ---------- stats ---------- */
function stats(ts){
  const n=ts.length;let tot=0,gw=0,gl=0,w=0,l=0,be=0,rs=[],peak=0,cum=0,mdd=0,best=null,worst=null,fol=0,folKnown=0,fees=0;
  for(const t of ts){const c=calc(t);tot+=c.net;fees+=+t.fees||0;
    if(c.net>0){w++;gw+=c.net}else if(c.net<0){l++;gl+=c.net}else be++;
    if(isNum(c.r))rs.push(c.r);
    cum+=c.net;peak=Math.max(peak,cum);mdd=Math.min(mdd,cum-peak);
    if(best===null||c.net>best)best=c.net;if(worst===null||c.net<worst)worst=c.net;
    if(t.followedPlan!==undefined&&t.followedPlan!==null){folKnown++;if(t.followedPlan)fol++}}
  let streak=0;for(let i=ts.length-1;i>=0;i--){const v=calc(ts[i]).net;if(v===0)break;const s=v>0?1:-1;if(streak===0)streak=s;else if(Math.sign(streak)===s)streak+=s;else break}
  return {n,tot,w,l,be,wr:(w+l)?w/(w+l):null,pf:gl?gw/-gl:(gw?Infinity:null),avgW:w?gw/w:null,avgL:l?gl/l:null,exp:n?tot/n:null,avgR:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null,totR:rs.reduce((a,b)=>a+b,0),mdd,best,worst,adh:folKnown?fol/folKnown:null,streak,fees};
}
function byDay(ts){const m={};for(const t of ts){(m[t.date]=m[t.date]||{net:0,n:0,w:0});const v=calc(t).net;m[t.date].net+=v;m[t.date].n++;if(v>0)m[t.date].w++}return m}
function accountState(a){
  const ts=allSorted().filter(t=>t.account===a.id);const days=byDay(ts);const keys=Object.keys(days).sort();const td=today();
  let bal=+a.start,maxEOD=+a.start;
  for(const k of keys){bal+=days[k].net;if(k<td)maxEOD=Math.max(maxEOD,bal)}
  const mll=+a.mll||0;
  let floor=a.trail==='static'?a.start-mll:Math.min(maxEOD-mll,+a.start);
  const todayNet=days[td]?days[td].net:0;
  return {bal,floor,cushion:bal-floor,todayNet,profit:bal-a.start,n:ts.length,locked:a.trail!=='static'&&maxEOD-mll>=a.start};
}

  const y=calMonth.getFullYear(),mo=calMonth.getMonth();
  const first=new Date(y,mo,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  let cells='',monthTot=0,monthN=0,greenDays=0,redDays=0;const td=today();
  for(let w=0;w<6;w++){let wk=0,wn=0;
    for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+w*7+i);const k=ymd(d),inM=d.getMonth()===mo,x=days[k];const note=store.days[k]&&(store.days[k].plan||store.days[k].review);
      if(x&&inM){wk+=x.net;wn+=x.n;monthTot+=x.net;monthN+=x.n;if(x.net>0)greenDays++;else if(x.net<0)redDays++}
      cells+=`<div class="d ${inM?'':'out'} ${k===td?'today':''} ${x?(x.net>0?'win':x.net<0?'loss':''):''}" data-day="${k}"><div class="n"><span>${d.getDate()}</span>${note?'<span class="note-dot" title="Has notes"></span>':''}</div>${x?`<div class="p ${cls(x.net)}">${usd0(x.net)}</div><div class="c">${x.n} trade${x.n>1?'s':''} · ${Math.round(x.w/x.n*100)}%</div>`:''}</div>`}
    cells+=`<div class="wk">Week<b class="${cls(wk)}">${wn?usd0(wk):'—'}</b>${wn?`${wn} trade${wn>1?'s':''}`:''}</div>`;
    const nx=new Date(start);nx.setDate(start.getDate()+(w+1)*7);if(nx.getMonth()!==mo&&nx>first)break;
  }

function cfgMount(){
  const note=t=>{const n=$('#dirtyNote');if(n)n.textContent=t};
  const validate=()=>{const d={...draft,instruments:draft.instruments.filter(i=>i.sym)};if(!d.accounts.length)return [null,'Keep at least one account'];
    for(const a of d.accounts){if(!a.name||!String(a.name).trim())return [null,'Every account needs a name'];if(!isNum(a.start))return [null,`“${a.name}” needs a start balance (numbers only, e.g. 50000)`]}
    for(const i of d.instruments){if(!isNum(i.pv)||i.pv<=0)return [null,`${i.sym} needs a $ per point value`]}return [d,null]};
  const autosave=async()=>{const [d,err]=validate();if(err){note('Not saved: '+err);return}note('Saving…');
    if(await saveSettings(d,true)){cfgDirty=false;note('All changes saved ✓')}else note('Save failed — check your connection')};
  const dirty=(now)=>{cfgDirty=true;note('Saving…');clearTimeout(window.__cfgT);window.__cfgT=setTimeout(autosave,now?0:700)};
  if(window.__cfgPending){window.__cfgPending=false;dirty(true)}
  document.querySelectorAll('[data-a]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{const a=draft.accounts[+el.dataset.a],k=el.dataset.k;a[k]=['start','mll','dll','target'].includes(k)?num(el.value):el.value;dirty()}));
  document.querySelectorAll('[data-i]').forEach(el=>el.addEventListener('input',()=>{const x=draft.instruments[+el.dataset.i],k=el.dataset.k;x[k]=k==='sym'?el.value.trim().toUpperCase():num(el.value);dirty()}));
  document.querySelectorAll('[data-list]').forEach(el=>el.addEventListener('input',()=>{draft[el.dataset.list]=el.value.split('\n').map(s=>s.trim()).filter(Boolean);dirty()}));
  $('#rulesTa').addEventListener('input',e=>{draft.rules=e.target.value;dirty()});
  $('#mtpd').addEventListener('input',e=>{draft.maxTradesPerDay=num(e.target.value);dirty()});
  $('#addA').onclick=()=>{draft.accounts.push({id:'a'+uid(),name:'Topstep 50K #'+(draft.accounts.length+1),start:50000,mll:2000,dll:null,target:3000,trail:'eod'});cfgDirty=true;window.__cfgPending=true;render()};
  $('#addI').onclick=()=>{draft.instruments.push({sym:'',pv:1,fee:0});cfgDirty=true;render()};
  document.querySelectorAll('[data-rma]').forEach(b=>b.onclick=()=>{const a=draft.accounts[+b.dataset.rma];const n=store.trades.filter(t=>t.account===a.id).length;
    confirmBox(`Remove “${a.name}”?`,n?`${n} trades are linked to it. They stay in your journal but won’t show under any account.`:'',()=>{draft.accounts.splice(+b.dataset.rma,1);cfgDirty=true;window.__cfgPending=true;render()})});
  document.querySelectorAll('[data-rmi]').forEach(b=>b.onclick=()=>{draft.instruments.splice(+b.dataset.rmi,1);cfgDirty=true;window.__cfgPending=true;render()});
  $('#saveCfg').onclick=async()=>{clearTimeout(window.__cfgT);const [d,err]=validate();if(err){toast(err);note('Not saved: '+err);return}
    if(await saveSettings(d)){cfgDirty=false;draft=null;toast('Setup saved');render()}};
  $('#resetCfg').onclick=()=>{cfgDirty=false;draft=null;render()};
  $('#bkJson').onclick=()=>showExport(JSON.stringify({version:1,exported:new Date().toISOString(),settings:store.settings,trades:store.trades,days:store.days},null,1),'backup.json');
  $('#rsJson').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(async txt=>{let d;try{d=JSON.parse(txt)}catch(_){toast('That file isn’t valid JSON');return}
    if(!d||!Array.isArray(d.trades)){toast('That doesn’t look like a journal backup');return}
    confirmBox('Restore backup?',`Adds or overwrites ${d.trades.length} trades, ${Object.keys(d.days||{}).length} day notes${d.settings?' and replaces your setup':''}. Trades not in the backup are kept.`,async()=>{
      if(d.settings)await saveSettings(mergeSettings(d.settings));
      for(const t of d.trades){if(t&&t.id)await saveTrade(t)}
      for(const [k,v] of Object.entries(d.days||{}))if(/^\d{4}-\d{2}-\d{2}$/.test(k))await saveDay(k,v);
      cfgDirty=false;draft=null;toast('Backup restored');render()})})};
}

const COLS=['date','time','account','instrument','side','contracts','entry','exit','stop','target','fees','pnlOverride','net','r','setup','session','grade','emotion','followedPlan','mistakes','notes','link'];
function toCSV(ts){
  const q=v=>{const s=String(v??'');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};
  const acc=id=>(store.settings.accounts.find(a=>a.id===id)||{}).name||'';
  return [COLS.join(','),...ts.map(t=>{const c=calc(t);return COLS.map(k=>k==='net'?c.net.toFixed(2):k==='r'?(isNum(c.r)?c.r.toFixed(2):''):k==='account'?acc(t.account):k==='mistakes'?(t.mistakes||[]).join('|'):k==='followedPlan'?(t.followedPlan===true?'yes':t.followedPlan===false?'no':''):t[k]).map(q).join(',')})].join('\n');
}
function parseCSV(txt){const rows=[];let r=[],f='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(v=>v.trim()!==''))}
function importCSV(txt){
  const rows=parseCSV(txt);if(rows.length<2){toast('No rows found');return}
  const h=rows[0].map(x=>x.trim());if(!h.includes('date')||!h.includes('instrument')){toast('CSV needs at least “date” and “instrument” columns (use Export CSV for the format)');return}
  const accByName=n=>(store.settings.accounts.find(a=>a.name.toLowerCase()===String(n).toLowerCase())||store.settings.accounts[0]).id;
  const out=rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=r[i]);const t={id:uid(),date:o.date,time:o.time||'',account:accByName(o.account||''),instrument:(o.instrument||'').toUpperCase(),side:/^s/i.test(o.side||'')?'Short':'Long',contracts:num(o.contracts)||1,entry:num(o.entry),exit:num(o.exit),stop:num(o.stop),target:num(o.target),fees:num(o.fees),pnlOverride:num(o.pnlOverride),setup:o.setup||'',session:o.session||'',grade:o.grade||'',emotion:o.emotion||'',followedPlan:/^y/i.test(o.followedPlan||'')?true:/^n/i.test(o.followedPlan||'')?false:null,mistakes:(o.mistakes||'').split('|').map(s=>s.trim()).filter(Boolean),notes:o.notes||'',link:o.link||''};
    if(!(isNum(t.entry)&&isNum(t.exit))&&!isNum(t.pnlOverride)&&isNum(num(o.net)))t.pnlOverride=num(o.net)+(t.fees||0);return t}).filter(t=>/^\d{4}-\d{2}-\d{2}$/.test(t.date||''));
  if(!out.length){toast('No valid rows (dates must be YYYY-MM-DD)');return}
  confirmBox(`Import ${out.length} trades?`,'They’ll be added to your journal alongside existing trades.',async()=>{let ok=0;for(const t of out){if(await saveTrade(t))ok++}toast(`Imported ${ok} trades`)},'Import');
}

/* ---------- routing ---------- */
window.addEventListener('beforeunload',e=>{if(cfgDirty){e.preventDefault();e.returnValue=''}});
function route(){const h=location.hash.slice(1);view=['dashboard','trades','calendar','config'].includes(h)?h:'dashboard';render()}
window.addEventListener('hashchange',route);
$('#newBtn').onclick=()=>{if(store.user)openTrade()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').innerHTML&&!document.querySelector('body>.scrim'))closeModal();
  if(e.key==='n'&&store.user&&!$('#modalRoot').innerHTML&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();openTrade()}});
route();
initStore();
</script>
</body>
